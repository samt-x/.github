name: Task – oppgave
description: Noe som skal gjøres, også oppfølging, utforsking og utredning
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Er oppgaven et innspill som ikke er behandlet, ikke sett Assignees. Bruk heller feltet nederst til å foreslå hvem som bør se på den. Se [Konvensjoner](https://docs.samt-bu.no/prosjektleveranser/loesninger/samhandlingsplattform/oppgavestyring/konvensjoner/).
  - type: textarea
    id: beskrivelse
    attributes:
      label: Hva skal gjøres?
      description: Kort om hva som skal gjøres og hvorfor. Planer, beskrivelser og resultater skrives på docs og lenkes i «Gjelder» ([én master per opplysning](https://docs.samt-bu.no/prosjektleveranser/loesninger/samhandlingsplattform/oppgavestyring/konvensjoner/#oppgaven-p%C3%A5-github-innholdet-p%C3%A5-docs)).
    validations:
      required: true
  - type: textarea
    id: ferdig-naar
    attributes:
      label: Ferdig når
      description: Hva må være på plass for at oppgaven kan lukkes?
    validations:
      required: false
  - type: input
    id: gjelder
    attributes:
      label: Gjelder
      description: Lenke til siden, caset, oppgaven eller elementet i Archi som saken gjelder. Planer, beskrivelser og resultater hører hjemme på docs-siden, ikke i issuet.
      placeholder: https://docs.samt-bu.no/...
    validations:
      required: false
  - type: input
    id: forslag-hvem
    attributes:
      label: Forslag til hvem som bør se på dette
      description: Skriv @brukernavn. De får et varsel og kan følge saken, uten å bli tildelt den.
      placeholder: "@brukernavn"
    validations:
      required: false
